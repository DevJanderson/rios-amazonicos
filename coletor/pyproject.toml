[project]
name = "rios"
version = "0.1.0"
description = "Coleta, limpeza e gravação das cotas dos rios amazônicos"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
