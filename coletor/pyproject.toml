[project]
name = "rios"
version = "0.1.0"
description = "Coleta, limpeza e gravação das cotas dos rios amazônicos"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "marimo>=0.25.2",
    "psycopg[binary]>=3.3.6",
    "selectolax>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.ruff.lint.per-file-ignores]
# marimo shows a cell's last expression as output
"notebooks/*.py" = ["B018"]
